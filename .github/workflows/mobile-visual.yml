name: Galaxy app visual review
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture candidates first; compare requires reviewed Linux baselines
        type: choice
        default: capture
        options:
          - capture
          - compare
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "true"
      PARLIAMENT_TEST_OUTPUT: artifacts/ci-results
      PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/ci-report
      PARLIAMENT_VISUAL_COMPARE: ${{ inputs.mode == 'compare' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python3 ../scripts/bootstrap_repository.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run build
      - run: npx playwright test --update-snapshots=none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: galaxy-ui-${{ inputs.mode }}
          path: |
            mobile/artifacts/note-visual/
            mobile/artifacts/ci-results/
            mobile/artifacts/ci-report/
          retention-days: 14
# No automatic baseline updates or public deployment.
