name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s scripts/tests -p test_repository_setup.py -v
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all

  java:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: python3 scripts/bootstrap_repository.py
      - run: ./gradlew --no-daemon check bootJar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-test-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/test-results/test/*.xml
          retention-days: 7

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked worker dependencies
        run: |
          python -m pip install uv==0.10.4
          cd worker
          uv sync --locked --all-extras
      - run: python scripts/bootstrap_repository.py
      - run: cd worker && uv run --frozen pytest -q
      - run: worker/.venv/bin/python -m unittest discover -s scripts/tests -v

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 scripts/bootstrap_repository.py
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=high
      - run: npm --prefix web test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  mobile:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python3 scripts/bootstrap_repository.py
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile audit --audit-level=high
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run build
      - run: cd mobile && npx playwright install --with-deps chromium
      - run: npm --prefix mobile run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: mobile-failure-evidence
          path: |
            mobile/test-results/
            mobile/playwright-report/
          retention-days: 7
